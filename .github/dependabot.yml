# Monthly, one grouped PR per ecosystem. Security updates come as they're found.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    # gst-plugins-rs is pinned to one rev, and gstreamer-rs and glib must stay at the
    # versions that rev resolves to (see CLAUDE.md): they move together, by hand.
    ignore:
      - dependency-name: "gstreamer*"
      - dependency-name: "gst-plugin-*"
      - dependency-name: "glib*"
      - dependency-name: "gio*"
