name: DIAG exit crash

on:
  push:
    branches: [claude/diag-exit-crash]

jobs:
  windows:
    name: Windows exit crash (shard ${{ matrix.shard }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - name: GStreamer
        uses: ./.github/actions/gstreamer-windows
        with:
          version: 1.28.8
          dir: C:\gstreamer\1.0\msvc_x86_64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p ui/dist
        shell: bash
      - name: Enable crash dumps
        shell: pwsh
        run: |
          New-Item -Force -Path "C:\dumps" -ItemType Directory | Out-Null
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting"
          Set-ItemProperty -Path $k -Name Disabled -Value 0 -Type DWord
          Set-ItemProperty -Path $k -Name DontShowUI -Value 1 -Type DWord
          New-Item -Force -Path "$k\LocalDumps" | Out-Null
          Set-ItemProperty -Path "$k\LocalDumps" -Name DumpFolder -Value "C:\dumps" -Type ExpandString
          Set-ItemProperty -Path "$k\LocalDumps" -Name DumpType -Value 2 -Type DWord
          Set-ItemProperty -Path "$k\LocalDumps" -Name DumpCount -Value 20 -Type DWord
          powershell -Command "[Environment]::FailFast('dump sanity check')"; "failfast exit: $LASTEXITCODE"
          Start-Sleep 5; Get-ChildItem C:\dumps
          Remove-Item C:\dumps\* -Force -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          exit 0
      - name: Build tests
        shell: bash
        run: |
          cargo test --no-run --color never 2>&1 | tee build.txt
          exe=$(grep -o 'src.main\.rs ([^)]*)' build.txt | sed -E 's/.*\((.*)\)/\1/')
          echo "EXE=$exe" >> $GITHUB_ENV
          echo "exe: $exe"
      - name: Loop tests under cdb
        shell: pwsh
        working-directory: node
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers" -Recurse -Filter cdb.exe | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1 -ExpandProperty FullName
          $env:_NT_SYMBOL_PATH = "srv*C:\symcache*https://msdl.microsoft.com/download/symbols;$env:GITHUB_WORKSPACE\target\debug\deps"
          $exe = Join-Path $env:GITHUB_WORKSPACE $env:EXE
          $cmds = 'sxe -c ".echo CRASH_FASTFAIL; .lines -e; r; kn 80; .echo ALL_THREADS; ~*kn 40; .echo MODULES; lm; q" c0000409; sxe -c ".echo CRASH_AV; kn 80; ~*kn 40; q" av; sxi ld; sxi ud; sxi ct; sxi et; g'
          $crashes = 0
          for ($i = 1; $i -le 60; $i++) {
            & $cdb -G -c $cmds $exe 2>&1 | Out-File -Encoding utf8 out.txt
            $text = Get-Content out.txt -Raw
            if ($text -match "CRASH_") {
              $crashes++
              "===== RUN $i CRASHED"
              Get-Content out.txt | Select-String -Pattern "test result|CRASH_" | ForEach-Object { $_.Line }
              $lines = Get-Content out.txt
              $idx = ($lines | Select-String -Pattern "CRASH_" | Select-Object -First 1).LineNumber
              $lines[($idx-1)..($lines.Length-1)] | Select-Object -First 2500
            } elseif ($text -notmatch "test result: ok") {
              "===== RUN $i OTHER"; Get-Content out.txt -Tail 40
            }
          }
          "CRASHES $crashes / 60"
          exit 0
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dumps-${{ matrix.shard }}
          path: C:\dumps
          if-no-files-found: ignore
          retention-days: 5
