name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with release.yml and scripts/macos/package.sh.
  GST_VERSION: 1.28.8

jobs:
  # On its own so a formatting slip fails in seconds and doesn't hide the
  # results of the other jobs.
  fmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  node:
    name: Node on Linux (clippy, tests, types)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The -dev packages to build against (plugins-bad has WebRTC, which
      # gst-plugin-webrtc links), libssl for reqwest's native TLS, and the
      # plugins the tests' pipelines use. Installing them from the mirror took
      # 48 minutes once, so they're cached; a change to the list (or `version`)
      # makes a new cache.
      - name: Install GStreamer
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: >-
            pkg-config libssl-dev
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-nice
          version: 1
      # A restored cache doesn't run the packages' install scripts.
      - run: sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `RustEmbed` needs the folder to exist; the UI build isn't needed here.
      - run: mkdir -p ui/dist

      # Each check runs even if an earlier one failed, so one run reports them all.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test

      - uses: taiki-e/install-action@v2
        if: ${{ !cancelled() }}
        with:
          tool: cargo-about

      # Fails on a dependency whose license about.toml doesn't accept.
      - name: Dependency licenses
        if: ${{ !cancelled() }}
        run: cargo about generate --locked about.hbs > /dev/null

      - name: Generated TS types are up to date
        if: ${{ !cancelled() }}
        run: |
          cargo test -p capture-room --features export-types
          if [ -n "$(git status --porcelain ui/src/types/generated)" ]; then
            git status --short ui/src/types/generated
            echo "::error::Generated types are stale: run 'pnpm types' and commit the result."
            exit 1
          fi

  # The platform the node ships on: lints the macOS-only code Linux never compiles.
  macos:
    name: Node on macOS (clippy, tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Cache GStreamer
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gstreamer
          key: gstreamer-${{ env.GST_VERSION }}-${{ hashFiles('scripts/macos/gstreamer.sh') }}

      # The same official framework the release bundles, built against in place.
      - name: GStreamer
        run: |
          gst_dir=$RUNNER_TEMP/gstreamer
          scripts/macos/gstreamer.sh "$GST_VERSION" "$gst_dir"
          sdk_lib=$gst_dir/sdk/GStreamer.framework/Versions/1.0/lib
          echo "PKG_CONFIG_PATH=$sdk_lib/pkgconfig" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$sdk_lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: mkdir -p ui/dist

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test

  # Not shipped yet: keeps the Windows-only code (the tray icon, display
  # windows) compiling, linted and tested.
  windows:
    name: Node on Windows (clippy, tests)
    runs-on: windows-2025
    env:
      # Not under Program Files: a space in the path breaks the flags
      # pkg-config prints.
      GST_DIR: C:\gstreamer\1.0\msvc_x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Cache GStreamer
        id: gst-cache
        uses: actions/cache@v6
        with:
          path: C:\gstreamer
          key: gstreamer-windows-${{ env.GST_VERSION }}

      # The official MSVC installer (one .exe since 1.28), runtime and
      # development files.
      - name: Install GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $exe = "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.exe"
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc/$exe"
          $path = Join-Path $env:RUNNER_TEMP $exe
          curl.exe -fsSL --retry 3 -o $path $url
          $sum = (curl.exe -fsSL --retry 3 "$url.sha256sum").Split(' ')[0]
          if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $sum) { throw "$exe doesn't match its checksum" }
          $setup = Start-Process $path -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS', '/TYPE=devel', "/DIR=$env:GST_DIR"
          if ($setup.ExitCode -ne 0) { throw "the installer exited with $($setup.ExitCode)" }
          # Plugins the node links in itself (gst-plugins-rs, statically): the
          # install's copies would clash with them.
          foreach ($plugin in 'gstndi', 'gstfallbackswitch', 'gstrswebrtc') {
            Remove-Item "$env:GST_DIR\lib\gstreamer-1.0\$plugin.dll" -ErrorAction SilentlyContinue
          }

      # Its bin has pkg-config and the DLLs the tests load.
      - name: Point the build at GStreamer
        shell: pwsh
        run: |
          $env:PATH = "$env:GST_DIR\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$env:GST_DIR\lib\pkgconfig"
          "$env:GST_DIR\bin" >> $env:GITHUB_PATH
          "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH" >> $env:GITHUB_ENV
          (Get-Command pkg-config).Source
          pkg-config --modversion gstreamer-1.0 gstreamer-webrtc-1.0 gstreamer-rtsp-server-1.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: mkdir -p ui/dist
        shell: bash

      # Each check runs even if an earlier one failed, so one run reports them all.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test

  ui:
    name: UI (type-check, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui type-check
      # `build` would re-run the type-check above.
      - run: pnpm --filter ui exec vite build
