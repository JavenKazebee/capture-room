name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (fmt, clippy, tests, types)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgstrtspserver-1.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `RustEmbed` needs the folder to exist; the UI build isn't needed here.
      - run: mkdir -p ui/dist

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test

      - name: Generated TS types are up to date
        run: |
          cargo test -p capture-room --features export-types
          if [ -n "$(git status --porcelain ui/src/types/generated)" ]; then
            git status --short ui/src/types/generated
            echo "::error::Generated types are stale: run 'pnpm types' and commit the result."
            exit 1
          fi

  ui:
    name: UI (type-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui type-check
