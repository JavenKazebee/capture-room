name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with release.yml and scripts/macos/package.sh.
  GST_VERSION: 1.28.8

jobs:
  # On its own so a formatting slip fails in seconds and doesn't hide the
  # results of the other jobs.
  fmt:
    name: Rust formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  node:
    name: Node on Linux (clippy, tests, types)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # About a minute, or seconds from the cache. The timeout is a backstop
      # for the script's own: three mirrors at a few minutes each.
      - name: GStreamer
        uses: ./.github/actions/gstreamer-linux
        timeout-minutes: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `RustEmbed` needs the folder to exist; the UI build isn't needed here.
      - run: mkdir -p ui/dist

      # Each check runs even if an earlier one failed, so one run reports them all.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: |
          fails=0
          for i in $(seq 12); do
            cargo test -p capture-room --features export-types 2>&1 | tee out.txt | tail -3
            if grep -q "saved_clip_outlives_buffer_and_exports ... FAILED" out.txt; then
              fails=$((fails+1)); sed -n '/---- pipeline::replay::tests::saved_clip_outlives_buffer_and_exports stdout/,/^failures:/p' out.txt | head -400
            fi
          done
          echo "FLAKES $fails / 12"

      - uses: taiki-e/install-action@v2
        if: ${{ !cancelled() }}
        with:
          tool: cargo-about

      # Fails on a dependency whose license about.toml doesn't accept.
      - name: Dependency licenses
        if: ${{ !cancelled() }}
        run: cargo about generate --locked about.hbs > /dev/null

      - name: Generated TS types are up to date
        if: ${{ !cancelled() }}
        run: |
          cargo test -p capture-room --features export-types
          if [ -n "$(git status --porcelain ui/src/types/generated)" ]; then
            git status --short ui/src/types/generated
            echo "::error::Generated types are stale: run 'pnpm types' and commit the result."
            exit 1
          fi

  # Lints and tests the macOS-only code Linux never compiles.
  macos:
    name: Node on macOS (clippy, tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Cache GStreamer
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/gstreamer
          key: gstreamer-${{ env.GST_VERSION }}-${{ hashFiles('scripts/macos/gstreamer.sh') }}

      # The same official framework the release bundles, built against in place.
      - name: GStreamer
        run: |
          gst_dir=$RUNNER_TEMP/gstreamer
          scripts/macos/gstreamer.sh "$GST_VERSION" "$gst_dir"
          sdk_lib=$gst_dir/sdk/GStreamer.framework/Versions/1.0/lib
          echo "PKG_CONFIG_PATH=$sdk_lib/pkgconfig" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$sdk_lib" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: mkdir -p ui/dist

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test

  # Lints and tests the Windows-only code (the service, the tray icon,
  # display windows) Linux never compiles.
  windows:
    name: Node on Windows (clippy, tests)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      # The same official MSVC build the release bundles.
      - name: GStreamer
        uses: ./.github/actions/gstreamer-windows
        with:
          version: ${{ env.GST_VERSION }}
          dir: C:\gstreamer\1.0\msvc_x86_64

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: mkdir -p ui/dist
        shell: bash

      # Each check runs even if an earlier one failed, so one run reports them all.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test

  ui:
    name: UI (type-check, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ui type-check
      - run: pnpm --filter ui test
      # `build` would re-run the type-check above.
      - run: pnpm --filter ui exec vite build
