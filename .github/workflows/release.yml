name: Release

# Pushing a tag vX.Y.Z (matching node/Cargo.toml's version) builds the macOS
# apps and publishes them, with install.sh, as a GitHub release. Run by hand,
# it builds the same files as a workflow artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GST_VERSION: 1.28.8

jobs:
  macos:
    name: macOS apps
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' node/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match node/Cargo.toml version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Package
        env:
          SKIP_UI: "1"
          GST_DIR: ${{ runner.temp }}/gstreamer
        run: |
          scripts/macos/package.sh aarch64
          scripts/macos/package.sh x86_64
          cp scripts/macos/install.sh dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Upload build
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: capture-room-macos
          path: dist/*
