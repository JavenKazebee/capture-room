name: Release

# Pushing a tag vX.Y.Z (matching node/Cargo.toml's version) builds the macOS
# apps, signs them with the release key, and publishes them with latest.json
# (what the updater checks) and install.sh as a GitHub release. Run by hand,
# it builds the same files as a workflow artifact without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with ci.yml and scripts/macos/package.sh.
  GST_VERSION: 1.28.8

jobs:
  macos:
    name: macOS apps
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' node/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match node/Cargo.toml version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # The updater only installs archives signed with the release key
      # (scripts/release-key.pub); its secret half is the MINISIGN_KEY secret.
      - name: Release key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          brew install minisign
          if [ -z "$MINISIGN_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::The MINISIGN_KEY secret isn't set: a release must be signed."
              exit 1
            fi
            echo "::warning::MINISIGN_KEY isn't set: this build is unsigned and nodes won't update to it."
            exit 0
          fi
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/release.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/release.key" >> "$GITHUB_ENV"

      - name: Package
        env:
          SKIP_UI: "1"
          GST_DIR: ${{ runner.temp }}/gstreamer
        run: |
          scripts/macos/package.sh aarch64
          scripts/macos/package.sh x86_64
          cp scripts/macos/install.sh dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes

      - name: Upload build
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: capture-room-macos
          path: dist/*
