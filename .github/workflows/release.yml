name: Release

# Pushing a tag vX.Y.Z (matching node/Cargo.toml's version) builds the apps,
# signs them with the release key, and publishes them with latest.json (what
# the updater checks), install.sh and install.ps1 as a GitHub release. Run by
# hand, it builds the same files as one workflow artifact without releasing.
#
# Each platform job uploads its dist files as an artifact named
# capture-room-<os>; publish, after all of them, merges those, writes
# latest.json once and makes the release, so a release never goes out with
# one platform missing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Keep in sync with ci.yml and scripts/macos/package.sh.
  GST_VERSION: 1.28.8

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: node/Cargo.toml
          sparse-checkout-cone-mode: false

      # Checked before any build so a mistagged release fails in seconds.
      - name: Tag matches the crate version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' node/Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match node/Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS apps
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Collects the Rust crates' licenses for the app's notices.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # The updater only installs archives signed with the release key
      # (scripts/release-key.pub); its secret half is the MINISIGN_KEY secret.
      - name: Release key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          brew install minisign
          if [ -z "$MINISIGN_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::The MINISIGN_KEY secret isn't set: a release must be signed."
              exit 1
            fi
            echo "::warning::MINISIGN_KEY isn't set: this build is unsigned and nodes won't update to it."
            exit 0
          fi
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/release.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/release.key" >> "$GITHUB_ENV"

      # package.sh's latest.json is for local tests only; publish writes the
      # release's, once every platform has built.
      - name: Package
        env:
          SKIP_UI: "1"
          GST_DIR: ${{ runner.temp }}/gstreamer
        run: |
          scripts/macos/package.sh aarch64
          scripts/macos/package.sh x86_64
          rm -f dist/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: capture-room-macos
          path: dist/*
          if-no-files-found: error
          # Long enough to re-run a failed publish.
          retention-days: 7

  linux:
    name: Linux app
    needs: version
    # The oldest supported distro, so the binary runs on all of them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The same packages as ci.yml's Linux job, and the same man-db skip.
      - name: Install GStreamer
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-nice

      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # As for macOS: the updater only installs archives signed with the
      # release key.
      - name: Release key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get install -y --no-install-recommends minisign
          if [ -z "$MINISIGN_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::The MINISIGN_KEY secret isn't set: a release must be signed."
              exit 1
            fi
            echo "::warning::MINISIGN_KEY isn't set: this build is unsigned and nodes won't update to it."
            exit 0
          fi
          printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/release.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/release.key" >> "$GITHUB_ENV"

      - name: Package
        env:
          SKIP_UI: "1"
        run: |
          scripts/linux/package.sh
          rm -f dist/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: capture-room-linux
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows app
    needs: version
    runs-on: windows-2025
    env:
      # Not under Program Files: a space in the path breaks the flags
      # pkg-config prints.
      GST_DIR: C:\gstreamer\1.0\msvc_x86_64
    steps:
      - uses: actions/checkout@v7


      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ui

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # The official MSVC build, built against and bundled.
      - name: GStreamer
        shell: pwsh
        run: scripts/windows/gstreamer.ps1 $env:GST_VERSION $env:GST_DIR

      # As in the macOS job. minisign from its author's release.
      - name: Release key
        shell: pwsh
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_VERSION: "0.12"
        run: |
          $zip = Join-Path $env:RUNNER_TEMP minisign.zip
          $url = "https://github.com/jedisct1/minisign/releases/download/$env:MINISIGN_VERSION/minisign-$env:MINISIGN_VERSION-win64.zip"
          curl.exe -fsSL --retry 3 -o $zip $url
          if ($LASTEXITCODE) { throw "download failed: $url" }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP minisign)
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP minisign) -Recurse -Filter minisign.exe | Select-Object -First 1
          Split-Path $exe.FullName >> $env:GITHUB_PATH
          if (-not $env:MINISIGN_KEY) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              Write-Output "::error::The MINISIGN_KEY secret isn't set: a release must be signed."
              exit 1
            }
            Write-Output "::warning::MINISIGN_KEY isn't set: this build is unsigned and nodes won't update to it."
            exit 0
          }
          $key = Join-Path $env:RUNNER_TEMP release.key
          [IO.File]::WriteAllText($key, "$env:MINISIGN_KEY`n")
          "MINISIGN_KEY_FILE=$key" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        env:
          SKIP_UI: "1"
        run: |
          scripts/windows/package.ps1
          Remove-Item dist/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: capture-room-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Every platform job: needs: version; checks out, builds the UI, signs capture-room-<os>-<arch>.tar.gz
  # (+ .sha256, and .minisig from MINISIGN_KEY, refusing an unsigned tag build
  # like macOS does); uploads dist/* as the artifact capture-room-<os>; and is
  # added to publish's needs. File names must not clash across platforms: the
  # artifacts are merged into one folder.

  publish:
    name: Publish
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: capture-room-*
          merge-multiple: true
          path: dist

      # One installer for every platform, so no platform job ships it.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/install.sh
            scripts/windows/install.ps1
          sparse-checkout-cone-mode: false
          path: source
      - run: cp source/scripts/install.sh source/scripts/windows/install.ps1 dist/

      - name: latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          printf '{"version": "%s"}\n' "$VERSION" > dist/latest.json

      # The updater refuses unsigned archives, so a release without every
      # signature would strand that platform's nodes.
      - name: Every archive is signed
        if: github.ref_type == 'tag'
        run: |
          for archive in dist/*.tar.gz; do
            [ -f "$archive.minisig" ] || { echo "::error::$archive has no .minisig"; exit 1; }
          done

      - run: ls -l dist

      # Not a pre-release: the updater and install.sh read releases/latest.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

      # The same files as a release, flat, so the folder can be served as
      # CAPTURE_ROOM_RELEASES to test the updater.
      - name: Upload build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: capture-room
          path: dist/*
          if-no-files-found: error
