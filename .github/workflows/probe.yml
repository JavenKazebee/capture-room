name: Probe replay flake
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GStreamer
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo -E apt-get install -y --no-install-recommends \
            pkg-config libssl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libgstrtspserver-1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-nice
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p ui/dist
      - run: cargo test --no-run -p capture-room
      - name: Loop
        run: |
          mkdir -p logs
          fails=0
          for i in $(seq 1 250); do
            if cargo test -q -p capture-room saved_clip_outlives_buffer_and_exports -- --nocapture > logs/run$i.log 2>&1; then
              true
            else
              fails=$((fails+1)); echo "FAIL $i"; grep -E "DBG|of sound" logs/run$i.log
            fi
          done
          echo "fails=$fails"; [ $fails -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-logs
          path: logs/
