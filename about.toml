# cargo-about: the license texts of every crate built into the node, for the
# notices shipped in the app (scripts/*/package.sh). Generating fails if a
# crate's license isn't accepted here, so a new dependency can't bring in a
# license that conflicts with the GPL unnoticed. Earlier entries are preferred
# when a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
# Every platform we ship, so crates built on only one of them are checked too.
# Each package's notices therefore cover all platforms' crates, not just its own.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Capture Room itself (GPL; its license is LICENSE).
private = { ignore = true }
