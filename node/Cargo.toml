[package]
name = "capture-room"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "capture-room"
path = "src/main.rs"

# Windows only: a no-op elsewhere, and only the Windows package ships it.
[[bin]]
name = "capture-room-launcher"
path = "src/bin/capture-room-launcher.rs"

[features]
export-types = ["dep:ts-rs"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-net = "0.23"
gstreamer-pbutils = "0.23"
gstreamer-rtsp-server = "0.23"
winit = "0.30"
gstreamer-sys = "0.23"
gstreamer-video = { version = "0.23", features = ["v1_16"] }
gstreamer-video-sys = "0.23"
gst-plugin-ndi = { git = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs.git", rev = "894e437dffa6851929ad48b85e7970943d650ed9", features = ["static"] }
gst-plugin-fallbackswitch = { git = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs.git", rev = "894e437dffa6851929ad48b85e7970943d650ed9", features = ["static"] }
gst-plugin-webrtc = { git = "https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs.git", rev = "894e437dffa6851929ad48b85e7970943d650ed9", default-features = false, features = ["static", "whip", "whep"] }
mdns-sd = "0.21"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["charset", "http2", "system-proxy", "json", "stream", "rustls-tls-webpki-roots"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }
uuid = { version = "1", features = ["v4", "serde"] }
gstreamer-utils = "0.23"
tower-http = { version = "0.7", features = ["fs"] }
minisign-verify = "0.3"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
sha2 = "0.11"
getrandom = "0.4"
hex = "0.4"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
objc2 = "0.6"
block2 = "0.6"

# Log rotation (`service::log_rotation`) on any Unix, sysctls on macOS.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
chrono-tz = "0.10"
